# The stable (:3000) build's web server.
#
# The security headers below mirror `vercel.json` deliberately. The Docker
# build exists to show what will ship, and a header set that only Vercel sends
# means the one build you can test locally is the one build that is not
# telling you the truth about its own defences. Any change to the CSP here
# must be made in `vercel.json` in the same edit, and vice versa - CLAUDE.md
# §28 is the single explanation of what each source is for.

server {
    listen 80;
    server_name localhost;

    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # `always`, on every one of these: without it nginx omits added
        # headers on error responses, so the 404 page - the response most
        # likely to be reached with a hostile URL - would be the one page in
        # the build with no CSP and no framing protection.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://icons.pawwalls.com; connect-src 'self' https://api.revenuecat.com https://e.revenue.cat; frame-ancestors 'none'; frame-src https://js.stripe.com; object-src 'none'; base-uri 'none'; form-action 'self'; worker-src 'self'; manifest-src 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(self \"https://js.stripe.com\"), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;

        # Two differences from `vercel.json`, both intentional:
        #
        #   * no `upgrade-insecure-requests` in the CSP. This server is
        #     http://localhost:3000 and the directive would rewrite its own
        #     asset requests to https, which nothing here answers.
        #   * no Strict-Transport-Security. It is a two-year promise a browser
        #     cannot be talked out of, and issuing it from localhost would
        #     break plain-HTTP localhost for every other project on the
        #     machine. Vercel sends it in production, which is the only place
        #     it belongs.
    }

    location /api/ {
        # No security headers here. The backend sets its own on every response
        # (`security_headers.py`), and adding a second set at the proxy would
        # send two `Content-Security-Policy` headers - which browsers combine
        # by intersection, so the effective policy becomes something neither
        # file states and nobody can read off either of them.
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
