# Render blueprint for the Zugzwang API.
#
# Backend only. The frontend is deployed to Vercel and reaches this service
# through a rewrite (see chess-frontend/vercel.json), so the browser only ever
# talks to one origin and no CORS is involved.
#
# To use: Render dashboard -> New -> Blueprint -> point at this repo and
# branch. Render reads this file and creates the service. GEMINI_API_KEY is
# the one thing it will prompt for.

services:
  - type: web
    name: zugzwang-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    region: frankfurt
    healthCheckPath: /api/health

    envVars:
      # sync: false means "ask me in the dashboard and keep it out of the
      # repo". The key must never be committed - it has leaked once already
      # (into the logs, via httpx request logging) and has not been rotated.
      - key: GEMINI_API_KEY
        sync: false

      # V4.5's move path is direct Gemini; Langflow is not deployed.
      - key: DISABLE_LANGFLOW
        value: "true"

      # Shallower search for a throttled free instance - see Dockerfile.backend.
      - key: STOCKFISH_DEPTH
        value: "12"
      - key: STOCKFISH_RANK_DEPTH
        value: "8"

# KNOWN LIMITS OF THIS DEPLOYMENT, all fine for a proof of concept and none of
# them silent failures:
#
#   * Free instances spin down after ~15 minutes idle and take the better part
#     of a minute to wake. With the frontend on a CDN the page will paint
#     instantly and then the first move will hang on a board that looks alive.
#
#   * The filesystem is ephemeral. The cross-game learning DB
#     (data/learning.db) resets on every deploy and restart. A persistent disk
#     fixes it and is a paid feature.
#
#   * Sandbox sessions live in memory, so this works on exactly one instance.
#     Do not scale the service horizontally without moving session state out
#     of the process - both the sandbox and the real game would break.
#
#   * The real game is still single-user: module-level state in app.py means
#     every visitor shares one board. Sandbox sessions are properly isolated;
#     normal play is not. This is the thing to fix before the URL is shared.
