# Render blueprint for the Zugzwang API.
#
# Backend only. The frontend is deployed to Vercel and reaches this service
# through a rewrite (see chess-frontend/vercel.json), so in normal use the
# browser only ever talks to one origin and no CORS is involved.
#
# "In normal use" is doing real work in that sentence now that the app carries
# an identity cookie. The moment anything talks to this service DIRECTLY - a
# preview build pointed at Render, a local page against the deployed API, curl
# from a browser context - CORS decides whether the cookie arrives, and a
# wrong answer is silent: no error, just a visitor who looks brand new on
# every request and a board that resets on refresh. Hence ALLOWED_ORIGINS.
#
# To use: Render dashboard -> New -> Blueprint -> point at this repo and
# branch. Render reads this file and creates the service. It will prompt for
# GEMINI_API_KEY and ALLOWED_ORIGINS.

services:
  - type: web
    name: zugzwang-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    region: frankfurt
    healthCheckPath: /api/health

    envVars:
      # sync: false means "ask me in the dashboard and keep it out of the
      # repo". The key must never be committed. It leaked once (into the logs,
      # via httpx request logging); that bug is fixed and the key has since
      # been rotated, so the exposed value is dead - see CLAUDE.md section 1
      # before repeating any warning to the contrary.
      - key: GEMINI_API_KEY
        sync: false

      # The frontend origin(s) allowed to make credentialed requests, comma
      # separated - the Vercel URL, plus any custom domain. sync: false so it
      # is set in the dashboard rather than committed, since it changes with
      # the deployment rather than with the code.
      #
      # Leave it unset and app.py falls back to localhost only. That is the
      # safe default, not a working one: it means a browser on the deployed
      # frontend talking straight to this service gets no identity cookie.
      #
      # Note that "*" is NOT an option here. The app sends credentials, and
      # the CORS spec forbids a wildcard origin on a credentialed response -
      # browsers reject it outright. app.py used to do exactly that, which is
      # why this variable exists.
      - key: ALLOWED_ORIGINS
        sync: false

      # V4.5's move path is direct Gemini; Langflow is not deployed.
      - key: DISABLE_LANGFLOW
        value: "true"

      # Shallower search for a throttled free instance - see Dockerfile.backend.
      - key: STOCKFISH_DEPTH
        value: "12"
      - key: STOCKFISH_RANK_DEPTH
        value: "8"

      # ---------------------------------------------------------------
      # Persistent storage (Neon Postgres)
      # ---------------------------------------------------------------
      # Required. Without it accounts and cross-game learning have nowhere to
      # go: the app still plays chess, logs an ERROR at startup, and reports
      # database:"not_configured" from /api/health. Either Neon endpoint works
      # here - db.py talks to the DIRECT one regardless, because the pooler
      # shares session state (search_path) between clients and that silently
      # writes rows into other schemas. See db.py's docstring before changing
      # this.
      #
      # Migrations run themselves on boot (db.migrate(), idempotent), so there
      # is no separate deploy step to forget.
      - key: DATABASE_URL
        sync: false

      # The build id reported by /api/health as `version`. Not declared: Render
      # sets RENDER_GIT_COMMIT itself and app.py reads that, so this works with
      # no configuration. Set BUILD_SHA only to override it somewhere else.

      # ---------------------------------------------------------------
      # Accounts
      # ---------------------------------------------------------------
      # ON. This is the account launch, so it is declared here rather than
      # left to default false - a flag that decides whether signup answers
      # 200 or 503 must not be something the deployment is silent about.
      # Everything it gates needs DATABASE_URL and SESSION_COOKIE_SECRET
      # above; with accounts on, neither is optional any more.
      - key: ACCOUNTS_ENABLED
        value: "true"

      # Session and guest cookies over HTTPS only. identity.py already infers
      # this on Render (SameSite=None implies Secure), but a security flag
      # that depends on inference is one nobody can check by reading the
      # blueprint.
      - key: COOKIE_SECURE
        value: "true"

      # Signs the guest identity cookie. MUST be stable across deploys: a new
      # value invalidates every guest cookie, so every visitor becomes a new
      # guest and loses the thread between their games - and any guest history
      # waiting to be claimed becomes unclaimable. Generate once with
      # `openssl rand -hex 32` and then leave it alone.
      - key: SESSION_COOKIE_SECRET
        sync: false

      # How long unclaimed guest history survives. Claimed history belongs to
      # an account and is never swept.
      - key: GUEST_RETENTION_DAYS
        value: "30"

      # Where to send the browser after a Google sign-in completes. The
      # frontend is on Vercel and this API is on Render, so "back where they
      # came from" is a different origin and cannot be inferred.
      - key: FRONTEND_URL
        sync: false

      # ---------------------------------------------------------------
      # Closed beta (beta_service.py, beta_gate.py)
      # ---------------------------------------------------------------
      # ON. Declared explicitly rather than left to the default for the same
      # reason ACCOUNTS_ENABLED is: a flag that decides whether the whole
      # application answers 200 or 403 must not be something the deployment is
      # silent about. The code default is also "on", so this file agreeing with
      # it is a statement of intent, not a requirement.
      #
      # Set it to "false" to re-open the app to the public. That is the only
      # value that opens it, and the startup log says which state it is in at
      # WARNING on every boot.
      - key: BETA_ACCESS_REQUIRED
        value: "true"

      # Keys the hash of every invitation code. REQUIRED, and declared here
      # rather than left to fall back.
      #
      # This block used to say the opposite - that declaring it was
      # unnecessary because beta_service.py falls back to
      # SESSION_COOKIE_SECRET, which this service already sets. The fallback
      # does still exist in the code, and relying on it COST A DEPLOY: the two
      # copies of SESSION_COOKIE_SECRET (`.env` here, the dashboard there)
      # turned out to differ, so every code minted locally was refused in
      # production and nothing in either place said why. An implicit secret is
      # one nobody thinks to compare.
      #
      # So: set it explicitly, set the SAME value in `.env`, and never change
      # it. Rotating it invalidates every outstanding invitation
      # irrecoverably - the database holds keyed hashes, not codes, so they
      # cannot be re-hashed.
      - key: BETA_CODE_PEPPER
        sync: false

      # ---------------------------------------------------------------
      # Request hygiene
      # ---------------------------------------------------------------
      # How many proxies in front of this process append to X-Forwarded-For.
      # On Render that is exactly one - their edge - because Dockerfile.backend
      # runs uvicorn directly with no nginx of its own. rate_limit.client_ip()
      # counts back from the RIGHT of that header by this many hops; anything
      # further left was written by the caller.
      #
      # Declared rather than defaulted because it is the number that decides
      # whether every rate limit in the app applies. Reading the leftmost entry
      # (what this used to do) let any caller pick their own bucket key with a
      # header, which made the Gemini-spend, login and beta-redeem limits
      # decorative. Change this only if an appending proxy is genuinely added
      # in front of Render's.
      #
      # NOT yet confirmed against Render itself - see DEPLOY.md for the
      # two-run check to make after the first deploy that carries this. It is
      # correct on the stated assumption that their edge appends exactly one
      # entry; that assumption could not be tested from a developer machine.
      #
      # Note also that Dockerfile.backend starts uvicorn with
      # --no-proxy-headers. Without that flag uvicorn rewrites the client
      # address from X-Forwarded-For itself, and this variable becomes
      # decorative because request.client.host is already the caller's value.
      - key: TRUSTED_PROXY_HOPS
        value: "1"

      # Cookie SameSite. NOT declared, and that is now the right default:
      # identity.py sends `Lax` everywhere. The frontend reaches this service
      # through Vercel's server-side rewrite, so the browser only ever sees one
      # origin and the cookies are first-party - `None` bought nothing and cost
      # the CSRF protection that Lax gives for free (see csrf.py). Set
      # COOKIE_SAMESITE=none ONLY if a browser is genuinely made to talk to
      # this origin directly, and know that it re-opens that hole.

      # ---------------------------------------------------------------
      # Transactional email (Mailjet) - password reset
      # ---------------------------------------------------------------
      # Without these, /api/auth/forgot-password still answers exactly as it
      # does with them - deliberately, since any difference is a way to tell
      # whether an address is registered - and simply sends nothing. So a
      # missing credential here is a silently broken reset, not a visible
      # error. All three are required.
      # Set to "false" to switch email off while keeping the credentials -
      # for a Mailjet account that is blocked or under review. The reset
      # endpoint then says so immediately instead of timing out per request.
      # Accounts are entirely usable in this state; only password recovery is
      # unavailable, and it says so.
      - key: EMAIL_ENABLED
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      # Must be an address or domain validated in Mailjet, or every send is
      # refused. Mailjet has no shared test sender to fall back on.
      - key: MAILJET_FROM_EMAIL
        sync: false
      - key: MAILJET_FROM_NAME
        value: Zugzwang

      # Google sign-in is built and unconfigured. Leave both unset and the
      # routes answer 503 and the UI offers no button; fill them in (plus the
      # redirect URI registered in the Google console) to switch it on. Note
      # that ACCOUNTS_ENABLED still gates everything above this.
      # - key: GOOGLE_CLIENT_ID
      #   sync: false
      # - key: GOOGLE_CLIENT_SECRET
      #   sync: false
      # - key: GOOGLE_REDIRECT_URI
      #   value: https://zugzwang-api.onrender.com/api/auth/google/callback

# KNOWN LIMITS OF THIS DEPLOYMENT, all fine for a proof of concept and none of
# them silent failures:
#
#   * Free instances spin down after ~15 minutes idle and take the better part
#     of a minute to wake. With the frontend on a CDN the page will paint
#     instantly and then the first move will hang on a board that looks alive.
#
#   * The filesystem is ephemeral, and nothing durable lives on it any more.
#     Accounts and cross-game learning are in Neon Postgres (DATABASE_URL
#     above); `data/` holds nothing a redeploy would be missed for. Migrations
#     are applied on boot and the image now ships `migrations/` - a build
#     without it refuses to start rather than serving an empty database.
#
#   * Sandbox sessions live in memory, so this works on exactly one instance.
#     Do not scale the service horizontally without moving session state out
#     of the process - both the sandbox and the real game would break.
#
#   * Guest games live in memory and die with the process. Every visitor now
#     has their OWN board (player_state.py + identity.py), which is what makes
#     the URL shareable at all - but a restart, including the free plan's idle
#     spin-down, drops every game in progress. That is what "nothing is saved"
#     means for a guest; it is not a bug, but it is more visible now that the
#     board being dropped is one specific person's.
#
#   * The app is PRIVATE (BETA_ACCESS_REQUIRED=true above). Every guarded /api
#     route answers 403 to a caller who has not redeemed an invitation; only
#     named identity, sign-in/recovery, health and beta-door routes stay open.
#     The beta landing page is what a browser draws instead of the board. Codes
#     are minted from a shell with `tools/beta_codes.py`; there is no admin
#     endpoint and there must not be. Confirm the door is shut from outside with
#     `curl -s https://zugzwang-api.onrender.com/api/health` - `beta_required`.
#
#   * Accounts are ON (ACCOUNTS_ENABLED=true above). The two reasons this note
#     used to give for keeping them off are both gone: accounts are in Neon,
#     not on the ephemeral disk, and password reset is built. What is shipping
#     UNMET is listed in DEPLOY.md, "What is still open with accounts on" -
#     principally that email addresses are unverified, that Mailjet delivery
#     is blocked at their end so password recovery is unavailable and says so,
#     and that there is no hard Gemini spend cap.
