# Render Blueprint - deploys the chess app as a single free service.
# In the Render dashboard: New > Blueprint > pick this repo > Apply.
# Render prompts once for every "sync: false" value below.
#
# There is deliberately no Langflow service here. The Chess flow was four
# nodes (ChatInput -> Prompt -> Gemini -> ChatOutput) wrapping a prompt this
# backend already builds itself, so it added no logic - but Langflow needs
# ~2 GB to boot, and Render's free and Starter plans both cap at 512 MB,
# where it is OOM-killed (exit 137). The backend now calls Gemini directly
# for move selection (see gemini_move_service.py), which costs nothing to
# run and removes a public Langflow UI from the attack surface.
#
# Langflow still runs locally via docker-compose.yml for editing the flow;
# Dockerfile.langflow and langflow-entrypoint.sh are kept for anyone who
# wants to host it again on a plan with enough memory.
services:
  - type: web
    name: chess-ai-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      # nginx serves the frontend AND proxies /api/* to uvicorn on 8080
      # internally (see chess-frontend/nginx.conf), so 80 is the only port
      # that needs to be public. uvicorn's 8080 never is.
      - key: PORT
        value: "80"
      - key: APP_NAME
        value: Chess AI Platform
      - key: APP_VERSION
        value: "1.0.0"
      # Call Gemini directly rather than routing through Langflow.
      - key: MOVE_SELECTOR
        value: gemini
      # nginx serves the frontend from this same origin, so no cross-origin
      # access is needed. Left unset, the allowlist is empty - the strictest
      # setting - and app.py's permissive localhost dev default never applies.
      - key: ALLOWED_ORIGINS
        sync: false
      # The only real secret this deployment needs.
      - key: GEMINI_API_KEY
        sync: false
