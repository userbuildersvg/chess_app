# Continuous integration.
#
# The rule here is that CI runs only what needs nothing a reviewer would have
# to be given: no API key, no database, no Stockfish binary, no running app.
# Everything that does need one of those is listed in the README's judge quick
# start instead, so the boundary is stated rather than implied by a passing
# badge that quietly skips half the suites.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend - lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chess-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: chess-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `npm run build` is the real typecheck: the root tsconfig is a solution
      # file, so a bare `tsc --noEmit` checks nothing at all.
      - run: npm run build

  backend:
    name: Backend - deterministic suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      # Each script prints its own pass count and exits non-zero on failure,
      # so no test runner is needed. These suites touch no database, no model
      # and no engine binary - they are pure logic over python-chess.
      - name: The saved-lesson loop
        run: python test_learning_loop.py
      - name: Opponent profiles
        run: python test_opponent_profiles.py
      - name: Review move tree
        run: python test_postmortem_state.py
      - name: Per-player game state
        run: python test_player_state.py
      - name: Learn move tree
        run: python test_sandbox_state.py
      - name: Coach settings
        run: python test_coach_style.py
      - name: Guided Play
        run: python test_guided_play.py
